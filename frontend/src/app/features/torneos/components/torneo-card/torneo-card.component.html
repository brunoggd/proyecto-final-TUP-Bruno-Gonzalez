<div class="torneo-card">
    <div class="torneo-card__button-and-logo">
        <div class="torneo-card__button">
            <button #button class="button">
                <img src="flecha-derecha.png" alt="right-arrow" class="button-icon">
            </button>
        </div>
        <div class="torneo-card__logo">
            <img src="tournamentLogo.png" alt="logo" class="tournament-icon">
        </div>
    </div>
    <div class="torneo-card__info">
        <p class="bottom-title"><img src="trofeo.png" alt="trophy" class="small-icon"> {{ torneo.nombre }} </p>
        <p class="bottom-title"><img src="calendario.png" alt="calendar" class="small-icon"> {{ torneo.fechaInicio| date: 'shortDate'}} </p>
        <p class="bottom-title"><img src="ubicacion.png" alt="location" class="small-icon"> {{ torneo.ubicacion }} </p>
        <p class="bottom-title" *ngIf="torneo.montoPremio > 0"><img src="dinero.png" alt="prize" class="small-icon"> {{ torneo.montoPremio }} </p>
    </div>
</div>
