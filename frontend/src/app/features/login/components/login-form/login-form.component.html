<div class="login-form-container">
    <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()" class="login-form">
        <div class="login-form__header">
            <div class="login-form__header-button">
                <button class="home-button" routerLink="/">←</button>
            </div>
            <div class="login-form__header-main-title">
                <p class="login-form-main-title">¡Bienvenido de nuevo!</p>
            </div>
        </div>

        <div class="login-form__field">
            <label for="email" class="login-form__field-label">Email:</label>
            <input class="login-form-input-email" id="email" type="email" formControlName="email"
                placeholder="example@gmail.com">
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                Debes ingresar un email válido
            </div>
        </div>

        <div class="login-form__field">
            <label for="password" class="login-form__field-label">Contraseña:</label>
            <input class="login-form-input-password" id="password" type="password" formControlName="contrasena"
                placeholder="12345678abc">
            <div *ngIf="loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched">
                La contraseña es obligatoria
            </div>
        </div>

        <button class="login-form-button" type="submit" [disabled]="loginForm.invalid">
            Iniciar sesión
        </button>
        <div *ngIf="error()">
            Credenciales inválidas
        </div>
    </form>
</div>
